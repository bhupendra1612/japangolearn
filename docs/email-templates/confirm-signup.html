<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:32px 12px;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td align="center">
      <table width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:16px;padding:32px;">
        <tr>
          <td align="center">
            <img src="https://japangolearn.com/email-logo.png" width="72" height="72" alt="JapanGoLearn" style="display:block;border:0;border-radius:16px;" />
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-top:20px;">
            <div style="font-size:22px;font-weight:bold;color:#101828;">Confirm your email</div>
            <div style="font-size:15px;color:#475467;padding-top:8px;">Enter this code in the JapanGoLearn app to activate your account.</div>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:28px 0;">
            <div style="display:inline-block;background:#f9f5ff;border:1px solid #e9d7fe;border-radius:12px;padding:16px 28px;font-size:34px;font-weight:bold;letter-spacing:10px;color:#6941c6;">{{ .Token }}</div>
          </td>
        </tr>
        <tr>
          <td align="center">
            <div style="font-size:13px;color:#667085;">This code expires in 60 minutes. If you did not create a JapanGoLearn account, you can ignore this email.</div>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-top:24px;">
            <div style="font-size:12px;color:#98a2b3;">JapanGoLearn &middot; japangolearn.com</div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
