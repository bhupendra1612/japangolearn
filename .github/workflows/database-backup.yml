name: Encrypted database backup

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo \"$VERSION_CODENAME\")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version
          pg_restore --version

      - name: Validate backup secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$SUPABASE_DB_URL" ]]; then
            echo "::error::Missing repository secret SUPABASE_DB_URL. Add the direct PostgreSQL connection URL for the JapanGoLearn Supabase project." >&2
            exit 1
          fi
          if [[ -z "$BACKUP_ENCRYPTION_PASSPHRASE" ]]; then
            echo "::error::Missing repository secret BACKUP_ENCRYPTION_PASSPHRASE. Add a strong passphrase used only for backup encryption." >&2
            exit 1
          fi

      - name: Create compressed backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -Eeuo pipefail
          pg_dump \
            --dbname="$SUPABASE_DB_URL" \
            --format=custom \
            --compress=9 \
            --no-owner \
            --no-acl \
            --file=japangolearn.dump
          test -s japangolearn.dump

      - name: Encrypt and verify backup
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -Eeuo pipefail
          passphrase_file="$(mktemp)"
          restore_check="japangolearn.restore-check.dump"
          cleanup() {
            rm -f "$passphrase_file" "$restore_check" japangolearn.dump
          }
          trap cleanup EXIT

          chmod 600 "$passphrase_file"
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" > "$passphrase_file"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "$passphrase_file" \
            --symmetric \
            --cipher-algo AES256 \
            --output japangolearn.dump.gpg \
            japangolearn.dump
          rm japangolearn.dump

          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "$passphrase_file" \
            --decrypt \
            --output "$restore_check" \
            japangolearn.dump.gpg
          pg_restore --list "$restore_check" > japangolearn.restore-list.txt
          test -s japangolearn.restore-list.txt
          grep -Eq 'TABLE[[:space:]]+public[[:space:]]+(profiles|learning_attempts|xp_ledger|daily_quest_completions)' japangolearn.restore-list.txt
          sha256sum japangolearn.dump.gpg > japangolearn.dump.gpg.sha256

      - name: Store encrypted backup
        uses: actions/upload-artifact@v7
        with:
          name: database-backup-${{ github.run_id }}
          path: |
            japangolearn.dump.gpg
            japangolearn.dump.gpg.sha256
            japangolearn.restore-list.txt
          retention-days: 30
          if-no-files-found: error
